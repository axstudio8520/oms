    <title>Interactive Order Links</title>
    <style>
        /* Basic Reset */
        body, h1, h2, p, a {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #34495e;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            width: 98%;
            max-width: 1400px;
            padding: 20px;
        }

        .section {
            margin-bottom: 15px;
        }

        /* Flexbox layout for 6 buttons per row */
        .button-group {
            display: flex;
            flex-wrap: nowrap; /* Forces them into one row */
            gap: 10px; 
            margin-bottom: 10px;
        }

        .button-group a {
            flex: 1; /* Distributes 6 buttons equally */
            text-align: center;
            padding: 15px 5px;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            text-decoration: none;
            border-radius: 4px;
            transition: background-color 0.3s ease, transform 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .button-group a span {
            font-size: 22px;
        }

        .button-group a:hover {
            transform: translateY(-3px);
            filter: brightness(1.1);
        }

        /* Your Original Colors */
        .new-button { background-color: #007BFF; }
        .packed-button { background-color: #ffc107; color: #000 !important; }
        .ready-to-ship-button { background-color: #28a745; }
        .inventory-button { background-color: #17a2b8; }
        .products-button { background-color: #dc3545; }
        .extra-button { background-color: #95a5a6; } /* Grey for new management buttons */

        /* Responsive: stack on mobile if the screen is too small */
        @media (max-width: 900px) {
            .button-group { flex-wrap: wrap; }
            .button-group a { flex: 1 1 calc(33.33% - 10px); }
        }
    </style>
</head>
