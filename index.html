    <style>
        :root {
            --bg-main: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            
            /* Accent gradients */
            --blue-grad: linear-gradient(135deg, #3b82f6, #1d4ed8);
            --amber-grad: linear-gradient(135deg, #f59e0b, #b45309);
            --green-grad: linear-gradient(135deg, #10b981, #047857);
            --purple-grad: linear-gradient(135deg, #8b5cf6, #6d28d9);
            --rose-grad: linear-gradient(135deg, #f43f5e, #be123c);
            --teal-grad: linear-gradient(135deg, #14b8a6, #0f766e);
            --slate-grad: linear-gradient(135deg, #64748b, #334155);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            background-image: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.12) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .dashboard-container {
            width: 100%;
            max-width: 1440px;
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 16px;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-sub);
            margin-bottom: 12px;
            font-weight: 700;
        }

        /* 7 buttons per row */
        .button-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
        }

        .btn {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(12px);
            border-radius: 12px;
            padding: 14px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            color: var(--text-main);
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
            min-width: 0;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: transparent;
            transition: background 0.25s ease;
        }

        .btn .icon {
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            transition: transform 0.2s ease;
        }

        .btn .label {
            font-size: 12.5px;
            font-weight: 600;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        /* Hover states */
        .btn:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.4);
        }

        .btn:hover .icon {
            transform: scale(1.1);
        }

        /* Category accent indicators */
        .theme-blue::before { background: var(--blue-grad); }
        .theme-blue:hover { background: rgba(59, 130, 246, 0.1); }

        .theme-amber::before { background: var(--amber-grad); }
        .theme-amber:hover { background: rgba(245, 158, 11, 0.1); }

        .theme-green::before { background: var(--green-grad); }
        .theme-green:hover { background: rgba(16, 185, 129, 0.1); }

        .theme-teal::before { background: var(--teal-grad); }
        .theme-teal:hover { background: rgba(20, 184, 166, 0.1); }

        .theme-rose::before { background: var(--rose-grad); }
        .theme-rose:hover { background: rgba(244, 63, 94, 0.1); }

        .theme-slate::before { background: var(--slate-grad); }
        .theme-slate:hover { background: rgba(100, 116, 139, 0.1); }

        @media (max-width: 1100px) {
            .button-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        @media (max-width: 640px) {
            .button-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
